# Build e testes automáticos: a cada envio, compila o firmware e roda o simulador (redesenho, troca de
# telas) e os testes de segurança (handlers, histórico, fuzzing de GIF e JPEG em 32 bits com ASan/UBSan).
# Ações fixadas por hash de commit; arduino-cli conferido pelo SHA-256 oficial. Nada aqui publica nada.
name: firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ARDUINO_CLI_VERSION: "1.5.1"  # (ARDUINO_CLI é o caminho do programa no compilar.sh)
      ESP8266_CORE: "esp8266:esp8266@3.1.2"
      ESP8266_INDEX: "https://arduino.esp8266.com/stable/package_esp8266com_index.json"
      GFX: /home/runner/Arduino/libraries/Adafruit_GFX_Library
      JSON: /home/runner/Arduino/libraries/ArduinoJson/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.18.0"  # a mesma do build local: o gzip do painel (web.h) sai igual byte a byte

      - name: g++ de 32 bits (simulador e testes)
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-multilib

      - name: arduino-cli (conferido pelo SHA-256 do release oficial)
        run: |
          set -o pipefail
          base="https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}"
          file="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/${ARDUINO_CLI_VERSION}-checksums.txt" | grep " $file\$" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar -xzf "$file" -C "$HOME/bin" arduino-cli
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: núcleo ESP8266 e bibliotecas (versões do projeto)
        run: |
          arduino-cli core update-index --additional-urls "$ESP8266_INDEX"
          arduino-cli core install "$ESP8266_CORE" --additional-urls "$ESP8266_INDEX"
          arduino-cli lib install "Adafruit GFX Library@1.13.0" "Adafruit ST7735 and ST7789 Library@1.11.0" \
            "Adafruit BusIO@1.17.4" "ArduinoJson@7.4.3"

      - name: painel (terser da versão fixa do web/package.json)
        run: cd web && npm install --no-audit --no-fund

      - name: simulador (mostradores, redesenho incremental, troca de telas) e painel
        run: |
          want=$(grep "conteúdo do painel antes do gzip" smalltv-pomodoro/web.h)
          bash sim/build.sh
          git checkout -- faces/ docs/ || true
          got=$(grep "conteúdo do painel antes do gzip" smalltv-pomodoro/web.h)
          # o conteúdo do painel tem que ser o commitado; os bytes do gzip podem variar de máquina para máquina,
          # então o firmware é compilado com o web.h commitado (o painel publicado sai da mesma máquina que ele)
          [ "$want" = "$got" ] || { echo "::error::painel (web/) mudou sem o web.h ser regerado: rode sim/build.sh e commite"; exit 1; }
          git checkout -- smalltv-pomodoro/web.h

      - name: testes de segurança (handlers, histórico, fuzzing de GIF e JPEG)
        run: bash sim/testes.sh 3000

      - name: firmware
        run: sh compilar.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/smalltv-pomodoro.ino.bin
            build/smalltv-pomodoro.ino.bin.gz
            web/out/
          retention-days: 14
